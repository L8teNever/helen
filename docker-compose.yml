services:
  helen:
    image: ghcr.io/l8tenever/helen:latest
    pull_policy: always
    container_name: helen
    ports:
      - "8001:8001"   # Settings UI
      - "8002:8002"   # GUI + Trigger links
    volumes:
      - ./data:/app/data
    environment:
      - HELEN_DB_PATH=/app/data/helen.db
      - HELEN_PUBLIC_BASE_URL=${HELEN_PUBLIC_BASE_URL:-http://localhost:8002}
      - HELEN_OAUTH_REDIRECT_URL=${HELEN_OAUTH_REDIRECT_URL:-http://localhost:8001/oauth/callback}
      - HELEN_SECRET_KEY=${HELEN_SECRET_KEY:-change-me-please-32-bytes-min-secret}
      - TZ=Europe/Berlin
    restart: unless-stopped
